<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ussy Word Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0F0F1A;color:#fff;padding:16px}
header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;background:#1A1A2E;padding:14px;border-radius:14px}
.logo{font-weight:900;font-size:20px}
.logo span{color:#FFD166}
.wrap{max-width:820px;margin:0 auto}
.hero{text-align:center;padding:14px 0}
.hero h1{font-size:32px}
.hero h1 span{color:#FFD166}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.mode-btn{background:#1A1A2E;border:2px solid #333;color:#fff;padding:13px 8px;border-radius:14px;cursor:pointer;font-weight:800}
.mode-btn.active{background:#FFD166;color:#000}
.game-card{background:#1A1A2E;border-radius:20px;padding:20px}
.scrambled{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0;min-height:60px}
.letter-box{width:52px;height:56px;background:#2D2D44;border:2px solid #A78BFA;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;cursor:pointer}
.letter-box.used{opacity:.25}
.answer-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px;margin:12px 0}
.answer-slot{width:52px;height:56px;background:#fff;color:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;cursor:pointer}
.answer-slot.empty{border:2px dashed #555;background:transparent;color:#fff}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.controls button{padding:13px 18px;border:none;border-radius:20px;font-weight:900;cursor:pointer}
.btn-green{background:#25D366;color:#fff}
.btn-gold{background:#FFD166;color:#000}
.btn-grey{background:#444;color:#fff}
.btn-purple{background:#A78BFA;color:#000}
.msg{text-align:center;font-weight:900;margin-top:14px;min-height:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">🧩 USSY <span>WORD PUZZLE</span></div>
<div>⭐ <span id="scoreTop">0</span> | 🔥 <span id="streakTop">0</span> | ❤️ <span id="livesTop">3</span></div>
</header>
<div class="hero">
<h1>Ussy Word <span>Puzzle</span></h1>
<p>Tap letters to form the word. Timer: <b id="timeBadge">60s</b> | Level: <b id="levelBadge">1</b></p>
</div>
<div class="modes">
<button class="mode-btn active" onclick="setMode('All',this)">🎲 All</button>
<button class="mode-btn" onclick="setMode('Nigeria',this)">🇳🇬 Nigeria</button>
<button class="mode-btn" onclick="setMode('Food',this)">🍲 Food</button>
<button class="mode-btn" onclick="setMode('Fashion',this)">👗 Fashion</button>
<button class="mode-btn" onclick="setMode('Football',this)">⚽ Football</button>
<button class="mode-btn" onclick="setMode('Animals',this)">🦁 Animals</button>
<button class="mode-btn" onclick="setMode('School',this)">📚 School</button>
<button class="mode-btn" onclick="setMode('Love',this)">❤️ Love</button>
</div>
<div class="game-card">
<p style="text-align:center;color:#aaa;">Tap letters:</p>
<div class="scrambled" id="scrambledBox"></div>
<p style="text-align:center;color:#aaa;">Your Answer:</p>
<div class="answer-row" id="answerBox"></div>
<p id="hintBox" style="text-align:center;margin:10px 0;color:#FFD166;">Hint go show here</p>
<div class="msg" id="msgBox"></div>
<div class="controls">
<button class="btn-green" onclick="checkAnswer()">Check Answer ✅</button>
<button class="btn-gold" onclick="useHint()">Hint 💡</button>
<button class="btn-grey" onclick="shuffleCurrent()">Shuffle 🔀</button>
<button class="btn-purple" onclick="clearAnswer()">Clear ❌</button>
</div>
<div style="text-align:center;margin-top:14px;">
<button class="btn-green" onclick="nextWord()" style="padding:13px 20px;border:none;border-radius:20px;font-weight:900;cursor:pointer;">Next ➡️</button>
<button class="btn-grey" onclick="restartGame()" style="padding:13px 20px;border:none;border-radius:20px;font-weight:900;cursor:pointer;">Restart 🔄</button>
</div>
</div>
</div>
<script>
function $(id){ return http://document.getElementById(id); }
var allWords = [
["LAGOS","Nigeria","Biggest city in Nigeria"],
["ABUJA","Nigeria","Capital of Nigeria"],
["JOLLOF","Food","Best rice in Nigeria"],
["EGUSI","Food","Soup with melon seed"],
["AMALA","Food","Brown swallow"],
["SUYA","Food","Spicy grilled meat"],
["FASHION","Fashion","Style and clothes"],
["SNEAKER","Fashion","Casual shoe"],
["BLAZER","Fashion","Sharp jacket"],
["FOOTBALL","Football","Best sport for Naija"],
["GOAL","Football","Wetin striker dey find"],
["LION","Animals","King of jungle"],
["MATHS","School","Subject with numbers"],
["LOVE","Love","Feeling wey make heart beat"],
["MANGO","Food","Sweet yellow fruit"],
["ENUGU","Nigeria","Coal city"],
["KANO","Nigeria","Big city for North"],
["SUIT","Fashion","Jacket + trouser"],
["TROPHY","Football","Cup winner go carry"],
["TIGER","Animals","Big cat with stripes"]
];
var currentMode = "All";
var filtered = [];
var currentWord = "";
var currentHint = "";
var currentCat = "";
var currentScrambled = "";
var userAnswer = [];
var score = 0;
var level = 1;
var streak = 0;
var lives = 3;
var timeLeft = 60;
var timerId = null;
var gameOver = false;
function shuffleStr(s){
var arr = http://s.split("");
for(var i = http://arr.length - 1; i > 0; i--){
var j = http://Math.floor(Math.random() _ (i + 1));
var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
}
return http://arr.join("");
}
function filterWords(){
filtered = [];
for(var i = 0; i < http://allWords.length; i++){
if(currentMode === "All" || allWords[i][1] === currentMode){ http://filtered.push(allWords[i]); }
}
}
function startTimer(){
if(timerId){ clearInterval(timerId); }
timeLeft = 60;
$("timeBadge").textContent = timeLeft + "s";
timerId = setInterval(function(){
timeLeft = timeLeft - 1;
$("timeBadge").textContent = timeLeft + "s";
if(timeLeft <= 0){
clearInterval(timerId);
lives = lives - 1;
streak = 0;
updateUI();
$("msgBox").textContent = "Time Up! Word was " + currentWord;
if(lives <= 0){ endGame(); }
else{ setTimeout(function(){ nextWord(); }, 1500); }
}
}, 1000);
}
function updateUI(){
$("scoreTop").textContent = score;
$("streakTop").textContent = streak;
$("livesTop").textContent = lives;
$("levelBadge").textContent = level;
}
function renderWord(){
var box = $("scrambledBox");
http://box.innerHTML = "";
userAnswer = [];
for(var i = 0; i < http://currentScrambled.length; i++){
var d = http://document.createElement("div");
http://d.className = "letter-box";
http://d.textContent = currentScrambled[i];
http://d.setAttribute("data-letter", currentScrambled[i]);
http://d.onclick = (function(el){
return function(){
if(el.className.indexOf("used") !== -1){ return; }
if(userAnswer.length >= http://currentWord.length){ return; }
http://el.className = "letter-box used";
http://userAnswer.push(el.getAttribute("data-letter"));
renderAnswer();
};
})(d);
http://box.appendChild(d);
}
renderAnswer();
$("hintBox").textContent = "Hint: " + currentHint + " | " + currentCat + " | " + http://currentWord.length + " letters";
$("msgBox").textContent = "";
}
function renderAnswer(){
var box = $("answerBox");
http://box.innerHTML = "";
for(var i = 0; i < http://currentWord.length; i++){
var s = http://document.createElement("div");
if(i < http://userAnswer.length){ http://s.className = "answer-slot"; http://s.textContent = userAnswer[i]; }
else{ http://s.className = "answer-slot empty"; http://s.textContent = "?"; }
http://s.onclick = (function(idx){
return function(){
if(idx < http://userAnswer.length){
var letter = userAnswer[idx];
http://userAnswer.splice(idx, 1);
var letters = $("scrambledBox").querySelectorAll(".letter-box");
for(var k = 0; k < http://letters.length; k++){
if(letters[k].textContent === letter && letters[k].className.indexOf("used") !== -1){ letters[k].className = "letter-box"; break; }
}
renderAnswer();
}
};
})(i);
http://box.appendChild(s);
}
}
function nextWord(){
if(gameOver){ return; }
var idx = http://Math.floor(Math.random() _ http://filtered.length);
var item = filtered[idx];
currentWord = item[0];
currentCat = item[1];
currentHint = item[2];
currentScrambled = shuffleStr(currentWord);
if(currentScrambled === currentWord){ currentScrambled = shuffleStr(currentWord); }
renderWord();
startTimer();
}
function shuffleCurrent(){ currentScrambled = shuffleStr(currentWord); renderWord(); }
function clearAnswer(){ renderWord(); }
function checkAnswer(){
if(gameOver){ return; }
var ans = http://userAnswer.join("");
if(ans.length !== http://currentWord.length){ $("msgBox").textContent = "Complete the word first boss!"; return; }
if(ans === currentWord){
score = score + 100 + timeLeft;
streak = streak + 1;
if(streak % 5 === 0){ level = level + 1; }
$("msgBox").textContent = "CORRECT! +" + (100 + timeLeft) + " points";
$("msgBox").style.color = "#25D366";
clearInterval(timerId);
updateUI();
setTimeout(function(){ nextWord(); }, 1200);
} else {
lives = lives - 1;
streak = 0;
$("msgBox").textContent = "Wrong! Try again. No be " + ans;
$("msgBox").style.color = "#FF6B6B";
updateUI();
if(lives <= 0){ endGame(); }
}
}
function endGame(){
gameOver = true;
clearInterval(timerId);
$("msgBox").textContent = "GAME OVER! Score: " + score + " - Press Restart";
}
function restartGame(){
score = 0; level = 1; streak = 0; lives = 3; gameOver = false;
updateUI(); filterWords(); nextWord();
}
function useHint(){
if(userAnswer.length >= http://currentWord.length){ return; }
http://userAnswer.push(currentWord[userAnswer.length]);
score = http://Math.max(0, score - 10);
updateUI(); renderAnswer();
$("msgBox").textContent = "Hint used!";
}
function setMode(mode, btn){
var all = http://document.querySelectorAll(".mode-btn");
for(var i = 0; i < http://all.length; i++){ all[i].classList.remove("active"); }
http://btn.classList.add("active");
currentMode = mode;
restartGame();
}
filterWords();
updateUI();
nextWord();
</script>
</body>
</html>
